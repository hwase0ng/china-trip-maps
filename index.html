<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🗺️ China Trip Maps 2026</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
h1 { font-size: 24px; margin-bottom: 8px; }
p { opacity: 0.7; margin-bottom: 30px; }
.card { background: linear-gradient(135deg, #16213e, #0f3460); border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; margin-bottom: 16px; text-align: center; transition: transform 0.2s; }
.card:hover { transform: translateY(-4px); }
.card h2 { font-size: 20px; margin-bottom: 6px; }
.card .desc { font-size: 13px; opacity: 0.6; margin-bottom: 12px; }
.card a { display: inline-block; padding: 10px 24px; border-radius: 8px; color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; }
a.sh { background: #0d5ec1; }
a.hz { background: #1e8e3e; }
.note { font-size: 12px; opacity: 0.4; margin-top: 20px; }
</style>
</head>
<body>

  </div>
  <div class="card">

  </div>
  <div class="note">

</html>
