var map = L.map("map",{zoomControl:true}).setView([30.28,120.12],12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18}).addTo(map);

var dk=["d1","d2","d3","d4","d5","d6"],ek=["hotel"],ak=dk.concat(ek);
var gs={};for(var i=0;i<ak.length;i++)gs[ak[i]]=L.layerGroup().addTo(map);
for(var d in routes){var co=colors[d];if(co)L.polyline(routes[d],{color:co.i,weight:2.5,opacity:0.6,dashArray:"8,8"}).addTo(gs[d])}

var ms={};
for(var i=0;i<pois.length;i++){
  var p=pois[i],co=colors[p.d]||colors.hotel,icon;
  if(p.d==="hotel"){icon=L.divIcon({html:'<div style="font-size:28px">🏨</div>',iconSize:[28,28],className:""})}
  else{icon=L.divIcon({html:'<div style="width:14px;height:14px;background:'+co.i+';border:3px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>',iconSize:[14,14],className:""})}
  var m=L.marker([p.lat,p.lng],{icon:icon}).addTo(gs[p.d]);
  var pop='<div class="lb"><div class="tag" style="background:'+co.c+'">'+co.l+'</div><h4>'+p.n+'</h4>'+(p.t?'<div>🕐 '+p.t+'</div>':'');

  pop+='</div>';
  m.bindPopup(pop);
  if(!ms[p.d])ms[p.d]=[];ms[p.d].push(m);
}

var bar=document.getElementById("filter-bar");
function cnt(d){var n=0;for(var i=0;i<pois.length;i++)if(pois[i].d===d)n++;return n}
var ab=document.createElement("button");ab.className="filter-btn filter-btn-all active";ab.innerHTML="📌 全部";bar.appendChild(ab);
var dbt={};
for(var i=0;i<dk.length;i++){
  (function(k){
    var b=document.createElement("button");b.className="filter-btn active";b.dataset.day=k;
    var co=colors[k];b.innerHTML='<span class="dot" style="background:'+co.i+'"></span> '+co.l+' <span class="count">('+cnt(k)+')</span>';
    b.style.borderColor=co.i;b.style.color=co.i;b.onclick=function(){tg(k)};bar.appendChild(b);dbt[k]=b;
  })(dk[i]);
}
var ed=document.createElement("div");ed.className="filter-extra";
var hb=document.createElement("button");hb.className="filter-extra-btn active";hb.innerHTML="🏨 酒店";var hco=colors.hotel;
hb.style.borderColor=hco.c;hb.style.color=hco.c;hb.onclick=function(){th()};ed.appendChild(hb);bar.appendChild(ed);
var al=true,da={d1:true,d2:true,d3:true,d4:true,d5:true,d6:true},ho=true;
ab.onclick=function(){sa()};
function sa(){al=true;for(var k in da)da[k]=true;ho=true;ui();ap();m.fitBounds(abnd())}
function tg(k){
  var n=0;for(var kk in da)if(da[kk])n++;
  if(al||n===dk.length){al=false;for(var kk in da)da[kk]=false;da[k]=true}
  else if(n===1&&da[k]){sa();return}else{for(var kk in da)da[kk]=false;da[k]=true;al=false}
  ui();ap()
}
function th(){ho=!ho;ui();ap()}
function ui(){
  ab.className="filter-btn filter-btn-all"+(al?" active":"");
  for(var i=0;i<dk.length;i++){var b=dbt[dk[i]];if(b)b.className="filter-btn"+(da[dk[i]]?" active":"")}
  hb.className="filter-extra-btn"+(ho?" active":"");hb.style.color=ho?"#fff":hco.c;hb.style.background=ho?hco.c:"#fff"
}
function ap(){
  for(var k in gs){
    if(da[k]!==undefined){if(da[k]){if(!map.hasLayer(gs[k]))map.addLayer(gs[k])}else{if(map.hasLayer(gs[k]))map.removeLayer(gs[k])}}
    else if(k==="hotel"){if(ho){if(!map.hasLayer(gs[k]))map.addLayer(gs[k])}else{if(map.hasLayer(gs[k]))map.removeLayer(gs[k])}}
  }
  fs()
}
function abnd(){var b=L.latLngBounds();for(var i=0;i<pois.length;i++)b.extend([pois[i].lat,pois[i].lng]);return b}
function fs(){
  var b=L.latLngBounds(),al2={};for(var k in da)al2[k]=da[k];al2.hotel=ho;
  for(var k in al2){if(al2[k]&&ms[k]){for(var i=0;i<ms[k].length;i++)b.extend(ms[k][i].getLatLng())}}
  if(b.isValid())m.fitBounds(b,{padding:[50,50]})
}
m.fitBounds(abnd(),{padding:[50,50]});
setTimeout(function(){m.invalidateSize()},300);
window.addEventListener("load",function(){m.invalidateSize()});
// Retry invalidateSize multiple times for mobile browsers
var retries=[500,800,1200,2000];
retries.forEach(function(d){setTimeout(function(){m.invalidateSize()},d)});
// ResizeObserver for modern browsers
if(window.ResizeObserver){new ResizeObserver(function(){m.invalidateSize()}).observe(document.getElementById("map"))}
